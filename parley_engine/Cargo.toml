[package]
name = "parley_engine"
version.workspace = true
description = "Parley Engine provides low level APIs for implementing text layout."
keywords = ["text", "layout"]
categories = ["gui", "graphics", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# Get floating point functions from the standard library
# (likely using your target's libc).
std = [
    "fontique/std",
    "harfrust/std",
    "parlance/std",
    "parley_data/std",
    "parley_emoji/std",
    "skrifa/std",
]
# Use floating point implementations from libm.
# This is useful for `no_std` environments.
# However, note that the `libm` crate is not as efficient as the standard library.
libm = ["fontique/libm", "harfrust/libm", "skrifa/libm"]
# Forwarded to `parlance`, which then implements traits from `bytemuck` on its types.
bytemuck = ["fontique/bytemuck", "parlance/bytemuck"]
# Enable dictionary-based line and word breaking for complex scripts (CJK, Thai, Khmer, Lao, Myanmar).
# When disabled, a lightweight segmenter is used that falls back to character-level breaks for those scripts.
# See `DictionaryProvider` for more details.
complex-scripts = []

[dependencies]
fontique = { workspace = true }
parlance = { workspace = true }
parley_data = { workspace = true }
parley_emoji = { workspace = true }

harfrust = { workspace = true }
hashbrown = { workspace = true }
icu_locale_core = { workspace = true }
icu_normalizer = { workspace = true, features = ["compiled_data"] }
icu_properties = { workspace = true, features = ["compiled_data"] }
icu_provider = { workspace = true }
icu_segmenter = { workspace = true, features = ["compiled_data"] }
linebender_resource_handle = { workspace = true }
skrifa = { workspace = true }

[lints]
workspace = true
